# Validates every Compose file with `docker compose config` on GitHub-hosted
# runners (Docker Engine and the Compose v2 plugin are preinstalled).
# Unset ${VAR}s only produce warnings: secrets are injected by Dockhand at
# deploy time and are never available here.
name: compose-validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: compose-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-config:
    name: docker compose config
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tool versions
        run: |
          docker version --format 'Docker Engine {{.Server.Version}}'
          docker compose version

      - name: Validate compose/**/compose.yaml
        shell: bash
        run: |
          set -uo pipefail
          shopt -s globstar nullglob
          files=(compose/**/compose.yaml)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::no compose/**/compose.yaml files found"
            exit 1
          fi
          fail=0
          for f in "${files[@]}"; do
            if docker compose --env-file .github/ci.env -f "$f" config --quiet; then
              echo "OK   $f"
            else
              echo "::error file=$f::docker compose config failed"
              fail=1
            fi
          done
          exit "$fail"

      - name: Check images are digest-pinned
        shell: bash
        run: |
          set -euo pipefail
          jq --version
          shopt -s globstar nullglob
          files=(compose/**/compose.yaml)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::no compose/**/compose.yaml files found"
            exit 1
          fi
          # Every rendered service must have image: <ref>@sha256:<64 hex>.
          # A build:-only service renders with no image, so it fails too.
          # Rendering drops commented-out lines, so those are ignored.
          fail=0
          for f in "${files[@]}"; do
            if ! json="$(docker compose --env-file .github/ci.env -f "$f" config --format json)"; then
              echo "::error file=$f::docker compose config --format json failed"
              fail=1
              continue
            fi
            if ! bad="$(jq -r '
                (.services // {}) | to_entries[]
                | select((.value.image // "") | test("^[^@]+@sha256:[0-9a-f]{64}$") | not)
                | .key' <<<"$json")"; then
              echo "::error file=$f::jq could not read the rendered config"
              fail=1
              continue
            fi
            if [ -n "$bad" ]; then
              while IFS= read -r svc; do
                echo "::error file=$f::service $svc image not digest-pinned"
              done <<<"$bad"
              fail=1
            else
              echo "OK   $f"
            fi
          done
          exit "$fail"
