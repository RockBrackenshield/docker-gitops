services:
  shelfmark-lite:
  #shelfmark:
    #image: ghcr.io/calibrain/shelfmark:latest
    image: ghcr.io/calibrain/shelfmark-lite:latest@sha256:b8bbc8ae26282c9cc765162719d2090142edf6c93c01c1eb430e51b1fa746ef2
    container_name: shelfmark-lite
    #container_name: shelfmark
    environment:
      EXT_BYPASSER_URL: ${FLARESOLVERR_URL}
      PUID: 1000
      PGID: 1000
    ports:
      - 8084:8084
    restart: unless-stopped
    volumes:
      - /srv/homelab/shelfmark/books:/books # Default destination for book downloads
      - /srv/homelab/shelfmark/config:/config # App configuration
      # Required for torrent / usenet - path must match your download client's volume exactly
      # - /path/to/downloads:/path/to/downloads
