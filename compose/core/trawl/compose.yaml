services:
  redis:
    image: redis:8.10.2-alpine
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
  trawl:
    image: ghcr.io/germondai/trawl:latest
    ports:
      - "${PORT:-8191}:8191"
      - "${MITM_PORT:-8192}:${MITM_PORT:-8192}"
    shm_size: 1gb
    environment:
      REDIS_URL: redis://redis:6379
      BROWSER_POOL_SIZE: ${BROWSER_POOL_SIZE:-1}
      MITM_ENABLED: ${MITM_ENABLED:-false}
      MITM_CA_DIR: /data/proxy-ca
    volumes:
      - /srv/homelab/trawl/trawl_proxy_ca:/data/proxy-ca
    depends_on:
      redis:
        condition: service_healthy
volumes:
  redis_data: