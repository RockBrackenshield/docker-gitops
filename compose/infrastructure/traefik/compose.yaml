services:
  traefik:
    image: traefik:v3.3
    container_name: traefik
    restart: unless-stopped
    command:
      - --api.dashboard=true
      - --api.insecure=false
      - --entrypoints.websecure.address=:8443
      # Trust PROXY protocol only from HAProxy (localhost on this node)
      - --entrypoints.websecure.proxyProtocol.trustedIPs=172.20.0.0/24
      - --entrypoints.websecure.forwardedHeaders.trustedIPs=172.20.0.0/24
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=traefik_proxy
      - --certificatesresolvers.cloudflare.acme.dnschallenge=true
      - --certificatesresolvers.cloudflare.acme.dnschallenge.provider=cloudflare
      - --certificatesresolvers.cloudflare.acme.email=admin@hermnet.org
      - --certificatesresolvers.cloudflare.acme.storage=/etc/traefik/acme/acme.json
      - --log.level=INFO
    environment:
      - CF_DNS_API_TOKEN_FILE=/run/secrets/cf_dns_api_token
    secrets:
      - cf_dns_api_token
    ports:
      - "8443:8443"
    networks:
      - traefik_proxy
    volumes:
      - /srv/homelab/traefik/acme:/etc/traefik/acme
      - /srv/homelab/traefik/dashboard-users.htpasswd:/etc/traefik/dashboard-users.htpasswd:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.dashboard.rule=Host(`traefik.infra.hermnet.org`)
      - traefik.http.routers.dashboard.entrypoints=websecure
      - traefik.http.routers.dashboard.tls=true
      - traefik.http.routers.dashboard.tls.certresolver=cloudflare
      - traefik.http.routers.dashboard.service=api@internal
      - traefik.http.routers.dashboard.middlewares=dashboard-auth
      - traefik.http.middlewares.dashboard-auth.basicauth.usersfile=/etc/traefik/dashboard-users.htpasswd

networks:
  traefik_proxy:
    external: true

secrets:
  cf_dns_api_token:
    file: /srv/homelab/traefik/secrets/cf_dns_api_token.txt