# ntfy notification server on the infrastructure node.
#
# Site values come from Dockhand (Bitwarden Secrets Manager) as ${VAR}. See
# "ntfy host setup (infrastructure)" in infrastructure/README.md for the
# variables, host directory, firewall rules, Zoraxy rule and first-run users
# and tokens. Configured with NTFY_* environment variables only (no server.yml).
services:
  ntfy:
    image: binwiederhier/ntfy:v2.38.0@sha256:771309aecfce18d8fe2bfb8069994ddd6be6ca6ccdd7badace3d791a0045ff0d
    container_name: ntfy
    restart: unless-stopped
    command: ["serve"]          # image ENTRYPOINT is "ntfy"; no server.yml is used
    init: true                  # upstream recommends it with the wget healthcheck
    user: "${NTFY_UID}:${NTFY_GID}"   # dedicated UID/GID that no human group shares
    ports:
      # Bound to the infrastructure node's LAN address only (Paperless pattern).
      # Zoraxy is the only intended client; host firewall rules in raw/PREROUTING
      # and DOCKER-USER enforce that (infrastructure/README.md, ntfy section).
      - target: 2586
        published: "2586"
        host_ip: ${INFRA_LAN_IP}
        protocol: tcp
    environment:
      - TZ=America/Detroit
      - NTFY_BASE_URL=${NTFY_BASE_URL}              # https URL Zoraxy serves, no trailing slash
      - NTFY_LISTEN_HTTP=:2586
      - NTFY_BEHIND_PROXY=true
      - NTFY_AUTH_FILE=/var/lib/ntfy/user.db        # holds tokens in plaintext: dir is 0700
      - NTFY_AUTH_DEFAULT_ACCESS=deny-all
      - NTFY_ENABLE_LOGIN=true
      - NTFY_REQUIRE_LOGIN=true
      - NTFY_ENABLE_SIGNUP=false
      - NTFY_CACHE_FILE=/var/lib/ntfy/cache.db
      - NTFY_CACHE_DURATION=24h
      - NTFY_ATTACHMENT_CACHE_DIR=/var/lib/ntfy/attachments
      - NTFY_ATTACHMENT_TOTAL_SIZE_LIMIT=1G
      - NTFY_ATTACHMENT_FILE_SIZE_LIMIT=15M
      - NTFY_ATTACHMENT_EXPIRY_DURATION=3h
      - NTFY_UPSTREAM_BASE_URL=                     # empty = ntfy.sh iOS relay OFF (Rock). Turning it on is a reviewed PR.
      - NTFY_LOG_LEVEL=info
      # NTFY_EXPERIMENTAL_LISTEN_ADMIN_UNIX is deliberately not set (no credential-less admin socket).
    volumes:
      - /srv/homelab/ntfy:/var/lib/ntfy             # user.db, cache.db, attachments/ (Backrest covers it; cache.db* excluded there)
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 100
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 -O - http://127.0.0.1:2586/v1/health | grep -q '\"healthy\":true' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
    cpus: 0.50
    mem_limit: 256m
    mem_reservation: 32m
