services:
  dockhand:
    image: fnsys/dockhand:v1.0.58@sha256:515c6e0f28cf3922c51a2dfd3463b972880e40418c2464b1bc91b8a3afe66c7f
    container_name: dockhand
    restart: always
    ports:
      - 3000:3000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /srv/homelab/dockhand/data:/app/data
      - /usr/local/bin/bws:/usr/local/bin/bws:ro