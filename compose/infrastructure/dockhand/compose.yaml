services:
  dockhand:
    image: fnsys/dockhand:v1.0.59@sha256:c2b0fc55e3ed299133f6caf63a764deb118ee402ea761548c3f8fd01d04fca06
    container_name: dockhand
    restart: always
    ports:
      - 3000:3000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /srv/homelab/dockhand/data:/app/data
      - /usr/local/bin/bws:/usr/local/bin/bws:ro