services:
  dockhand:
    image: fnsys/dockhand:v1.0.60@sha256:b8aed678af7563680d561db297fe513857c9adc263cc39e373c3434f0d1532e2
    container_name: dockhand
    restart: always
    ports:
      - 3000:3000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /srv/homelab/dockhand/data:/app/data
      - /usr/local/bin/bws:/usr/local/bin/bws:ro