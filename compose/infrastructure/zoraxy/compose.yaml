services:
  zoraxy:
    image: zoraxydocker/zoraxy:v3.3.5@sha256:2dfc5acf4c84e3e477a8f1fcb7d05a600a8c3cd5fd1296a848372375910ae9dd
    container_name: zoraxy
    restart: always
    networks:
      - infra_edge   # keep the existing external bridge; rename later to `edge` once HAProxy/Traefik are fully decommissioned
      - infra_internal
    ports:
      - "80:80"         # HTTP -> auto-redirect to HTTPS (configured in-UI)
      - "443:443"       # HTTPS entrypoint; replaces HAProxy's 443 SNI frontend
      - "8000:8000"     # Zoraxy management UI -- see note below on exposing this safely
    volumes:
      - /srv/homelab/zoraxy/config:/opt/zoraxy/config/
      - /srv/homelab/zoraxy/plugin:/opt/zoraxy/plugin/
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - FASTGEOIP=true
      - TZ=America/Detroit   # adjust to your actual TZ
      # PORT=8000 is the default management port; no need to set unless changing it
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  infra_edge:
    external: true
    name: infra_edge
  infra_internal:
    external: true
    name: infra_internal