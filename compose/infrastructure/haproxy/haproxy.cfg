global
    log stdout format raw local0
    maxconn 4096

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 5s
    timeout client  30s
    timeout server  30s
    timeout tunnel  1h

# Optional but handy: HTTP stats page on a non-public port
frontend stats
    mode http
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 10s

frontend https_in
    bind *:443
    mode tcp
    tcp-request inspect-delay 5s
    tcp-request content accept if { req.ssl_hello_type 1 }

    use_backend be_core       if { req.ssl_sni -m end .core.hermnet.org }
    use_backend be_infra      if { req.ssl_sni -m end .infra.hermnet.org }
    use_backend be_monitoring if { req.ssl_sni -m end .mon.hermnet.org }
    default_backend be_infra

backend be_core
    mode tcp
    server core1 <core_lan_ip>:8443 send-proxy check

backend be_infra
    mode tcp
    server infra1 traefik:8443 send-proxy check

backend be_monitoring
    mode tcp
    server mon1 <monitoring_lan_ip>:8443 send-proxy check