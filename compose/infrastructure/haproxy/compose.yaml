services:
  haproxy:
    image: haproxy:3.0-alpine
    container_name: haproxy
    restart: unless-stopped
    ports:
      - "443:443"
      - "8404:8404"   # stats page, optional
    networks:
      - traefik_proxy
    volumes:
      - /srv/homelab/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    cap_add:
      - NET_BIND_SERVICE

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_proxy"
      - "traefik.http.routers.haproxy-stats.rule=Host(`haproxy.infra.hermnet.org`)"
      - "traefik.http.routers.haproxy-stats.entrypoints=websecure"
      - "traefik.http.routers.haproxy-stats.tls.certresolver=cloudflare"
      - "traefik.http.services.haproxy-stats.loadbalancer.server.port=8404"

networks:
  traefik_proxy:
    external: true