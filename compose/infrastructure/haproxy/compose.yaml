services:
  haproxy:
    image: haproxy:3.0-alpine
    container_name: haproxy
    restart: unless-stopped
    ports:
      - "443:443"
      - "8404:8404"   # stats page, optional
    networks:
      - traefik_proxy
    volumes:
      - /compose/infrastructure/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    cap_add:
      - NET_BIND_SERVICE

networks:
  traefik_proxy:
    external: true